plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = "mc-agent-mcp"
}

repositories {
	// Loom adds the essential maven repositories (Mojang, Fabric) automatically.
}

loom {
	splitEnvironmentSourceSets()

	// Loom 1.18+ inlines mixin targets (intermediary names) into the mixin
	// classes at remapJar time; no legacy refmap AP is needed.
	mods {
		"mcagent" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang official mappings: current Fabric default, avoids yarn lag on new versions.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "LICENSE_mc-agent-mcp" }
	}
}
