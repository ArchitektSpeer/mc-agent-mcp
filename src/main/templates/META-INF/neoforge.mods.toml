modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "MC Agent MCP"
authors = "mc-agent-mcp contributors"
description = '''
Exposes an MCP (Model Context Protocol) server over Streamable HTTP so AI agents can perceive and play Minecraft.
'''

[[mixins]]
config = "mcagent.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
